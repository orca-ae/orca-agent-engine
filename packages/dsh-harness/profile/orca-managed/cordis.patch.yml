# Complete reviewed tree: no base bundle, discovery, native tools, HMR or plugin manager.
- insert:
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: projections
      name: '@deepseek-ai/dsh-session-projection'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.ORCA_DSH_SYSTEM
    - id: tools
      name: '@deepseek-ai/dsh-tools'
      config:
        mode: native
    - id: agents
      name: '@deepseek-ai/dsh-agent'
    - id: loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js process.env.DSH_HOME + '/sessions'
        compression: none
    - id: working-directory
      # Private directory validation only; no native model-visible filesystem tools.
      name: '@deepseek-ai/dsh-working-directory'
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
    - id: session-query
      name: '@deepseek-ai/dsh-session-query'
    - id: subagents
      name: '@deepseek-ai/dsh-subagent'
    - id: spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
    - id: fork
      name: '@deepseek-ai/dsh-subagent-fork-in-process'
    - id: orca-bridge
      name: ORCA_DSH_PLUGIN

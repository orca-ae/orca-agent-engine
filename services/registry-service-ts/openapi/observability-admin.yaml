info:
  title: Observability administration in Orca Agent Engine
  version: 0.0.0
  description: >-
    Admin-listener-only operations. Organization and platform credentials are separate.
    Configuration acceptance does not establish exporter capability or remote delivery. Generated
    from standalone Registry contracts; not part of the public Managed Agents API.
tags:
  - name: Organization observability
  - name: Workspace observability
  - name: Platform observability
servers:
  - url: https://{admin-host}
    variables:
      admin-host:
        default: admin.example.com
    description: Registry admin listener origin, not the public Workspace endpoint
components:
  securitySchemes:
    organizationApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Organization admin key (orca_admin_...). Not a Workspace or platform key.
    organizationOidc:
      type: http
      scheme: bearer
      description: >-
        Admin OIDC token with org:admin and an organization claim. Scoped OIDC roles are not
        supported.
    platformApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Independent platform key (orca_platform_...) with platform:admin.
    platformOidc:
      type: http
      scheme: bearer
      description: Platform OIDC token with platform:admin from the configured platform issuer/audience.
x-orca-source:
  repository: orca-ae/orca-agent-engine
  contracts:
    agent-observability.contract.ts: b3f4690aefc8b2e63cd05b146cd4b2164bfb823c34f99c271ccf41c9ed5e75fc

  - id: success-schema-response-requiredness-and-unions
    match: { class: success-schema, path: '/v1/*' }
    covers: 72
    deltaFingerprint: sha256:d457fa620e6e6be32642637b93a995c5cbfa76fd1661dea277d9a3e566c80409
    decision: accepted-deviation
    reference: docs/managed-agents/conformance.md#classification
    rationale: >-
      Dominated by one convention: Anthropic marks response fields `required`,
      guaranteeing their presence, while our schemas leave most optional. Ours is
      the weaker promise, so a client written against their spec may find a field
      absent that they would have guaranteed. Recorded as accepted rather than
      fixed because tightening it is a response-contract change across the whole
      surface, not a spec edit. The remainder is the same union and nullability
      shapes as the request side, plus `guardrail_ids` on the six agent response
      rows — served only under `orca-beta`, hence optional rather than required,
      and additive either way.

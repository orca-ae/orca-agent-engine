name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# A new push supersedes the in-flight review for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    # Drafts are skipped before the job starts. The review command declines
    # drafts anyway, but only after paying for runner + Claude Code startup.
    # Fork PRs are skipped too: a `pull_request` run from a fork receives no
    # secrets, so the review could only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gh pr comment needs write to publish the review
      issues: read
      id-token: write

    # Must be job-level: the action's own env: block does not export a token,
    # so gh would otherwise run unauthenticated inside Claude's shell.
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the review command inspects git log/blame for context.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Agent mode grants no tools by default, and Bash is permission-gated,
          # so every gh/git call the review command makes has to be listed here.
          # Pin the model independently of the CLI's rolling default.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,LS,Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

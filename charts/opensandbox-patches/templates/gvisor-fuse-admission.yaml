{{- if .Values.admission.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: opensandbox-gvisor-fuse
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: >-
        has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor'
      message: opensandbox Pods must use runtimeClassName gvisor
    - expression: >-
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)) &&
        object.spec.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged))
      message: opensandbox Pod containers must not be privileged
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: opensandbox Pods must not use hostPath volumes
    - expression: >-
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        (!has(object.spec.hostPID) || !object.spec.hostPID) &&
        (!has(object.spec.hostIPC) || !object.spec.hostIPC) &&
        !has(object.spec.hostUsers)
      message: opensandbox Pods must not join host namespaces or set hostUsers
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: opensandbox-gvisor-fuse
spec:
  policyName: opensandbox-gvisor-fuse
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: opensandbox
{{- end }}

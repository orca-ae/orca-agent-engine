{{- if eq .Values.internalAuth.mode "kubernetes_service_account" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-registry-tokenreview" (include "orca-managed-agents.fullname" .) .Release.Namespace | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orca-managed-agents.registryServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
{{- end -}}

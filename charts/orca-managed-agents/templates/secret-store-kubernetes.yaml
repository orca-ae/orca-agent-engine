{{- if eq .Values.secretStore.mode "kubernetes" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orca-managed-agents.secretStoreName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-secret-store
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orca-managed-agents.fullname" . }}-registry-secret-store
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "orca-managed-agents.secretStoreName" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orca-managed-agents.fullname" . }}-registry-secret-store
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orca-managed-agents.registryServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orca-managed-agents.fullname" . }}-registry-secret-store
{{- end -}}

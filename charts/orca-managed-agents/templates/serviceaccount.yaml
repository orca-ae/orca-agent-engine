{{- if .Values.registry.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orca-managed-agents.registryServiceAccountName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
  {{- with .Values.registry.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.harness.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orca-managed-agents.harnessServiceAccountName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness
  {{- with .Values.harness.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.aiGateway.enabled .Values.aiGateway.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orca-managed-agents.aiGatewayServiceAccountName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway
  {{- with .Values.aiGateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- $observabilityExporter := default (dict) .Values.observabilityExporter }}
{{- $observabilityExporterServiceAccount := default (dict) (dig "serviceAccount" (dict) $observabilityExporter) }}
{{- if (dig "create" true $observabilityExporterServiceAccount) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orca-managed-agents.observabilityExporterServiceAccountName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability-exporter
  {{- with (dig "annotations" (dict) $observabilityExporterServiceAccount) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- $toolset := default (dict) .Values.toolset }}
{{- $toolsetServiceAccount := dig "serviceAccount" (dict) $toolset }}
{{- if and (dig "enabled" false $toolset) (dig "create" false $toolsetServiceAccount) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orca-managed-agents.toolsetServiceAccountName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: toolset
  {{- with (get $toolsetServiceAccount "annotations") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

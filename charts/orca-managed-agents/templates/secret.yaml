{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) -}}
{{- $databaseUrl := coalesce .Values.secrets.values.databaseUrl .Values.external.databases.registryUrl -}}
{{- $transcriptStoreDatabaseUrl := coalesce .Values.secrets.values.transcriptStoreDatabaseUrl .Values.external.databases.transcriptStoreUrl $databaseUrl -}}
{{- $filestoreDatabaseUrl := coalesce .Values.secrets.values.filestoreDatabaseUrl .Values.external.databases.filestoreUrl -}}
{{- $memorystoreDatabaseUrl := coalesce .Values.secrets.values.memorystoreDatabaseUrl .Values.external.databases.memorystoreUrl -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orca-managed-agents.secretName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if empty .Values.external.databases.existingSecret }}
  DATABASE_URL: {{ required "external.databases.registryUrl or secrets.values.databaseUrl is required when secrets.create=true" $databaseUrl | quote }}
  TRANSCRIPT_STORE_DATABASE_URL: {{ $transcriptStoreDatabaseUrl | quote }}
  FILESTORE_DATABASE_URL: {{ required "external.databases.filestoreUrl or secrets.values.filestoreDatabaseUrl is required when secrets.create=true" $filestoreDatabaseUrl | quote }}
  MEMORYSTORE_DATABASE_URL: {{ required "external.databases.memorystoreUrl or secrets.values.memorystoreDatabaseUrl is required when secrets.create=true" $memorystoreDatabaseUrl | quote }}
  {{- end }}
  SESSION_JWT_PRIVATE_KEY_PEM: {{ required "secrets.values.sessionJwtPrivateKeyPem is required when secrets.create=true" .Values.secrets.values.sessionJwtPrivateKeyPem | quote }}
  SESSION_JWT_PUBLIC_KEY_PEM: {{ required "secrets.values.sessionJwtPublicKeyPem is required when secrets.create=true" .Values.secrets.values.sessionJwtPublicKeyPem | quote }}
  {{- with .Values.secrets.values.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.s3AccessKeyId }}
  S3_ACCESS_KEY_ID: {{ . | quote }}
  S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.s3SecretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ . | quote }}
  S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.kafkaAuthToken }}
  KAFKA_AUTH_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.kafkaSaslUsername }}
  KAFKA_SASL_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.kafkaSaslPassword }}
  KAFKA_SASL_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.kafkaSchemaRegistryUsername }}
  KAFKA_SCHEMA_REGISTRY_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.kafkaSchemaRegistryPassword }}
  KAFKA_SCHEMA_REGISTRY_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.pulsarAuthToken }}
  PULSAR_AUTH_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.pulsarOauth2ClientSecret }}
  PULSAR_OAUTH2_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.pulsarOauth2PrivateKey }}
  PULSAR_OAUTH2_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.openSandboxApiKey }}
  OPEN_SANDBOX_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.agentEnvApiKey }}
  AGENTENV_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.e2bApiKey }}
  E2B_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}

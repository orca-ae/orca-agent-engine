apiVersion: v1
kind: Service
metadata:
  name: {{ include "orca-managed-agents.registryAdminServiceName" . }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-admin
spec:
  type: ClusterIP
  ports:
    - name: admin-http
      port: {{ .Values.registry.service.adminPort }}
      targetPort: admin-http
      protocol: TCP
  selector:
    {{- include "orca-managed-agents.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: registry

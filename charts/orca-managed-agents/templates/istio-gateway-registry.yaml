{{- if .Values.registry.istio.enabled -}}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "orca-managed-agents.registryServiceName" . }}
  # Created next to the selected gateway workload (not in the release
  # namespace): the TLS credential is resolved from that namespace, and
  # meshes running PILOT_SCOPE_GATEWAY_TO_NAMESPACE=true ignore Gateway
  # resources from other namespaces.
  namespace: {{ .Values.registry.istio.gatewayNamespace }}
  labels:
    {{- include "orca-managed-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  selector:
    {{- toYaml .Values.registry.istio.gateway.selector | nindent 4 }}
  servers:
    - hosts:
        - {{ .Values.registry.istio.host | quote }}
      port:
        name: https-registry
        number: 443
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.registry.istio.gateway.tls.credentialName | quote }}
{{- end }}

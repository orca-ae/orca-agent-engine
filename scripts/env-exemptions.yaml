  # Single-token literals the broadened collector now picks up out of the config
  # sources. Accepting single tokens is what makes a real one like `PORT`
  # checkable; these three are the whole cost of that on this tree.

  - name: BEGIN
    reason: not-an-env-var
    note: >-
      A PEM guard in registry config.ts:443 — `rawKey.includes('BEGIN')` distinguishes a PEM block
      from a bare key. Not a variable.

  - name: SIGINT
    reason: not-an-env-var
    note: >-
      The POSIX signal name, passed to process.on() in harness-server main.ts:403.

  - name: SIGTERM
    reason: not-an-env-var
    note: >-
      The POSIX signal name, passed to process.on() in harness-server main.ts:404.

  - name: SIGKILL
    reason: not-an-env-var
    note: >-
      The POSIX signal name, passed to child.kill() in the kind-helm e2e driver at
      kind-helm-e2e.ts:200 and :443 when a port-forward outlives its grace period.

  - name: RSA
    reason: not-an-env-var
    note: >-
      An openssl `genpkey -algorithm` argument in kind-helm-e2e.ts:795, where the driver mints
      the session-JWT keypair the rendered chart is asserted against.

  - name: KAFKA_TRANSCRIPT_OK
    reason: not-an-env-var
    note: >-
      A sentinel the kind-helm driver writes to stdout (kind-helm-e2e.ts:1005) and matches on
      (:1026) to assert a transcript round-tripped through Kafka. An in-band success marker,
      not a knob.

  - name: TRANSCRIPT_MODULES_OK
    reason: not-an-env-var
    note: >-
      The same sentinel pattern for the transcript module probe — written at kind-helm-e2e.ts:943,
      matched at :961.

  - name: NODE
    reason: not-an-env-var
    note: >-
      A heredoc delimiter. `docker-entrypoint.sh:27` opens an inline script with
      `node - <<'NODE'`, and the quoted delimiter reads as a SCREAMING_SNAKE literal to the
      collector's broad net.

  - name: ALL_PASS
    reason: not-an-env-var
    note: >-
      A sentinel the E2B spike script prints when every check passed
      (spike-orca-default.ts:197), so a human scanning the log has one token to look for.

  - name: COMMIT
    reason: not-an-env-var
    note: >-
      The SQL statement, issued verbatim by the e2e seeder at seed.ts:132.

  - name: ROLLBACK
    reason: not-an-env-var
    note: >-
      Its counterpart, in the failure path at seed.ts:135.

  - name: ECONNREFUSED
    reason: not-an-env-var
    note: >-
      A Node error code the e2e client matches at client.ts:105 to tell an operator to run
      `make stack-up` rather than surfacing a bare connection error.

  - name: UND_ERR_SOCKET
    reason: not-an-env-var
    note: >-
      An undici error code, matched alongside it at client.ts:106.

  - name: UNKNOWN_TOPIC_OR_PARTITION
    reason: not-an-env-var
    note: >-
      Kafka protocol error code 3, recognized in packages/transcript-store/src/kafka/consumer.ts
      and documented in docs/managed-agents/libraries/transcript-store.md for cold-topic
      subscription retries. An error identifier, not a configuration variable.

  - name: ENOENT
    reason: not-an-env-var
    note: >-
      The POSIX errno, matched by the local runtime at runtime.ts:263 and :355 to distinguish
      a missing path from a real I/O failure.

  - name: SESSION_PER_EVENT
    reason: not-an-env-var
    note: >-
      The only accepted value of a Trigger's `session_mode` field, declared as a zod literal at
      services/registry-service-ts/src/contracts/triggers.contract.ts:68. An enum member in the wire
      contract, not a knob.

  - name: FULL_TRANSITIVE
    reason: not-an-env-var
    note: >-
      A Schema Registry subject compatibility policy chosen by platform operators, not an
      application environment variable. Transcript clients never update this Registry policy.

  - name: SESSION_JWT_PUBLIC_KEY_PEM
    reason: not-an-env-var
    note: >-
      A Kubernetes Secret *item key*, not an environment variable. The chart projects it to the
      file `session-jwt-public-key-pem` (charts/.../_helpers.tpl:203) and the gateway reads the
      mounted path; nothing reads it from process.env. The e2e driver asserts that projection at
      kind-helm-e2e.ts:1117.


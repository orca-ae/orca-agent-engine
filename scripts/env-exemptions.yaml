# Environment-variable exemption register.
#
# `pnpm docs:env-check` fails when a documented `SCREAMING_SNAKE` identifier is
# not read by a scanned config file. Some legitimately are not, and this file is
# where that is *declared* rather than inferred.
#
# It exists because four rounds of regex tightening could not tell the two apart.
# The check used to accept "setting" shapes — a bare quoted `'NAME'`, a
# `NAME:` key, a `${NAME}` — so that variables exported for something else to
# read would pass. Those shapes rescued 19 names, 7 of which are not environment
# variables at all but exported constants named in prose. They could not be
# tightened either: `subprocess-entry.ts` reads
#
#     const DEFAULT_CWD_ENV = 'SANDBOX_HARNESS_DEFAULT_CWD';
#     process.env[DEFAULT_CWD_ENV]
#
# which no name-based pattern resolves. The doc side over-collected and the
# wiring side over-accepted, and the two errors cancelled.
#
# So intent is declared here instead of guessed there. Adding an entry is a line
# in a diff a reviewer can argue with.
#
# reason:
#   not-an-env-var       backticked identifier that is not an environment
#                        variable — an exported constant, a capability name, a
#                        SQL keyword. Nothing to wire.
#   wired-elsewhere      a real variable, consumed outside the scanned configs:
#                        a chart, a CI workflow, a subprocess env. Requires
#                        `site`, which must exist and still contain the name.
#   intentionally-absent documented in order to say this repo does *not* set it.
#                        Inverts the check: the gate fails if a config ever
#                        starts reading it.
#
# Both directions are enforced. An entry whose name no doc mentions any more, or
# that a config has since started reading, fails as dead — otherwise this file
# only grows and starts reading as coverage it no longer provides.
#
# Some entries exist only because the collectors over-collect on purpose:
# single-token names that are an HTTP verb, a SQL keyword, a signal, an errno,
# a heredoc delimiter, or a shell local. They are enumerated here so the claim
# is checkable rather than illustrative, and `validateRegisterInventory` fails
# the run when this list and the register disagree in either direction. That
# check exists because the sentence was hand-written twice and wrong both
# times: first counting three config-side entries as disjoint from twenty-one
# single-token ones when they were a subset, then omitting `NODE` in the very
# commit that added it.
#
# single-token inventory >>>
#   PROVIDERS BEGIN SIGINT SIGTERM SIGKILL RSA
#   NODE COMMIT ROLLBACK ECONNREFUSED ENOENT DOCKERFILE
#   DELETE LISTEN NOTIFY
#   INSERT CONCURRENTLY ACCEPTED STRICT SETFCAP
#   COMPOSE CREATEDB
# <<< end inventory
#
# (HOME, TMPDIR, TMP and TEMP are single-token too, but are real variables the
# local runtime sets, filed as `wired-elsewhere`.) That is the deliberate trade:
# under-collecting
# fails silently, which is the failure this gate exists to prevent, so the
# collectors cast wide and the exceptions are written down. A cheaper rule was
# measured and rejected — counting a single token only when it heads a table row
# costs 3 entries instead of 20, but makes coverage depend on doc formatting,
# and inference is what every bug in this gate has been made of. Narrowing the
# config-side net was measured too: collecting quoted literals only from
# argument lists that mention `env` saves three entries and silently loses four
# real variables to the name-constant indirection, which is the wrong trade.
#
# Every entry here is load-bearing: removing any one turns the gate red. That is
# checked by leave-one-out, not asserted — two entries (`GET`, `POST`) were found
# inert that way and deleted. Re-run it when this file grows: an entry that
# suppresses nothing is indistinguishable from one that does, until you remove it.
#
# What this file CANNOT do, stated plainly so nobody assumes otherwise:
# `not-an-env-var` suppresses both directions, and `collectDeclared` cannot tell
# a quoted string literal apart from a real read — that ambiguity is why it
# over-collects in the first place. So a `not-an-env-var` entry for a genuine,
# undocumented variable will pass, and only the required `note` and a human
# reading this diff stand in the way.
#
# One thing does catch it: `collectEnvAccessed` collects the strictly narrower
# set of names reached through `env.NAME` or `env['NAME']`, and an entry naming
# one of those fails as dead. Being read through `process.env` is not evidence
# that a name is a variable, it is the definition of one. The earlier rule
# correlated two weak signals instead — documented AND declared — and was wrong
# in both directions: it passed nine exported constants, then flagged `GET` and
# `POST`, which are HTTP methods in a route table and HTTP methods in a
# fixture's request options. `intentionally-absent` was never abusable this way,
# since any config reading the name fails immediately.
#
# Scope: every file under `services/` and `packages/` that reads `process.env`
# is scanned — 24 of them, enumerated in `CONFIG_SOURCES` and checked against a
# walk of the tree by `validateScanCoverage`, so a new reader cannot be omitted
# by leaving a line out. That check exists because the omission had already
# happened: `KIND_HELM_NAMESPACE`, `KIND_HELM_E2E_TIMEOUT_MS`,
# `ORCA_MANAGED_CHART_DIR`, and `ORCA_GATEWAY_CHART_DIR` were read by a
# checked-in script, documented nowhere, and the gate reported "env docs in
# sync".

version: 1

exemptions:

  # ---------------------------------------------------------------------------
  # Single-token identifiers. The phantom check stopped skipping these when
  # `PORT` became a real declared variable and a stale doc for it would have
  # gone unnoticed. Each of the following is genuinely not an env var this
  # repo owns — an HTTP verb, a SQL keyword, a capability, or a POSIX variable
  # the OS provides.
  # ---------------------------------------------------------------------------

  - name: CREATEDB
    reason: not-an-env-var
    note: >-
      PostgreSQL role attribute required to create the deterministic spend suite's isolated databases.

  - name: DELETE
    reason: not-an-env-var
    note: >-
      HTTP method, in the harness-modes route table.

  - name: LISTEN
    reason: not-an-env-var
    note: >-
      Postgres command, in the kubernetes doc describing NOTIFY-based wakeups.

  - name: NOTIFY
    reason: not-an-env-var
    note: >-
      Postgres command, its counterpart in the same paragraph.

  - name: INSERT
    reason: not-an-env-var
    note: >-
      SQL keyword, in the file-store doc describing dedup.

  - name: CONCURRENTLY
    reason: not-an-env-var
    note: >-
      Postgres index-build modifier, in event-processing-semantics.

  - name: ACCEPTED
    reason: not-an-env-var
    note: >-
      An event state in event-processing-semantics, not a variable.

  - name: STRICT
    reason: not-an-env-var
    note: >-
      Istio's mTLS peer-authentication mode, named in architecture.md when describing transport
      security between services. A mesh setting, not a variable this repo reads.

  - name: SETFCAP
    reason: not-an-env-var
    note: >-
      A Linux capability, in the kubernetes and OpenSandbox securityContext docs.

  # ---------------------------------------------------------------------------
  # intentionally-absent — documented so that the *absence* is the claim. The
  # gate fails if a config ever starts reading one of these.
  # ---------------------------------------------------------------------------

  - name: HARNESS_REGISTRY_API_KEY
    reason: intentionally-absent
    note: >-
      multi-workspace-isolation.md states harness never owns or receives a workspace API key, and
      names this variable to say it does not exist. Reading it would break that isolation claim.

  - name: CLAUDE_CODE_SKIP_FAST_MODE_ORG_CHECK
    reason: intentionally-absent
    note: >-
      harness-modes.md notes the fast-mode wire test runs without this SDK escape hatch, which is
      what makes it a real assertion about the SDK rather than about our own bypass.

  - name: HTTP_PROXY
    reason: intentionally-absent
    note: >-
      mcp-routing.md documents it as deliberately unused — Node's native fetch ignores it, so MCP
      egress does not honour it. Setting it would imply a routing guarantee we do not make.

  - name: HTTPS_PROXY
    reason: intentionally-absent
    note: >-
      The TLS counterpart of HTTP_PROXY, unused for the same reason.
